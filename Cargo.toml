[workspace]
members = [
    "cargo-maturity",
    "examples/projects/showcase",
    "maturity-cli",
    "maturity-core",
    "maturity-macro",
    "maturity-report",
]
default-members = ["maturity-core", "maturity-macro", "maturity-report"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.1"

repository = "https://codeberg.org/SANOTW/maturity.git"
homepage = "https://codeberg.org/SANOTW/maturity.git"

[workspace.dependencies]
# Maturity or self dependencies
maturity-macro = { version = "0.1.2", path = "maturity-macro" }
maturity-core = { version = "0.2.0", path = "maturity-core" }
maturity-report = { version = "0.2.0", path = "maturity-report" }
# instead of locally now these are taken from the crates.io
# cargo-maturity = { version = "0.1.2", path = "cargo-maturity" }
# maturity-cli = { version = "0.1.2", path = "maturity-cli" }

cargo-maturity = "0.1.3"
maturity-cli = "0.1.3"

# Utilities
# logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# fast recursive directory iterator that respects various filters such as globs, file types and `.gitignore` files.
ignore = "0.4.28"
# time - related
chrono = "0.4.45"
# error handling
thiserror = "2.0.18"
# command line argument parser for rust
clap = { version = "4.6.1", features = ["derive"] }
# parsing a stream of Rust tokens into a syntax tree of Rust source code
syn = { version = "2.0.118", features = ["full", "extra-traits"] }
# for building beautiful terminal tables for reporting
comfy-table = "7.2.2"
# add colour to rust terminals
owo-colors = "4.3.0"
# turns rust syntax tree data structures into tokens of source code
quote = "1.0.46"
